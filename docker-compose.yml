services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bay
      POSTGRES_PASSWORD: bay
      POSTGRES_DB: bayworks
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bay -d bayworks"]
      interval: 2s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    volumes:
      - localstackdata:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mock-dms:
    build: .
    command: uvicorn mock_dms.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      MOCK_DMS_FAIL_RATE: "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://bay:bay@postgres:5432/bayworks
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      MOCK_DMS_URL: http://mock-dms:8001
    depends_on:
      postgres:
        condition: service_healthy
      mock-dms:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: .
    command: python -m app.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://bay:bay@postgres:5432/bayworks
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      MOCK_DMS_URL: http://mock-dms:8001
    depends_on:
      postgres:
        condition: service_healthy
      mock-dms:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
  localstackdata:
