services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bay
      POSTGRES_PASSWORD: bay
      POSTGRES_DB: bayworks
    command: postgres -c shared_buffers=32MB -c max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bay -d bayworks"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: bayworks
      MINIO_ROOT_PASSWORD: bayworksdemo1
    volumes:
      - miniodata:/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    command: ["/bin/sh", "/app/scripts/ec2-app.sh"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://bay:bay@postgres:5432/bayworks
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: bayworks
      S3_SECRET_KEY: bayworksdemo1
      S3_BUCKET: bayworks
      S3_REGION: us-east-1
      MOCK_DMS_URL: http://127.0.0.1:8001
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 420m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  miniodata:
